global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: collector
    static_configs:
      - targets: ["collector:8001"]

  - job_name: consumer
    static_configs:
      - targets: ["consumer:8002"]

  - job_name: fastapi
    static_configs:
      - targets: ["fastapi:8000"]
    metrics_path: /metrics
